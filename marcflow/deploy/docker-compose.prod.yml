# Produção numa VPS: MySQL e app sem porta pública; só o Caddy (HTTPS automático) fica exposto.
# Gerado e iniciado por deploy/install.sh. Uso manual: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: marcflow
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/marcflow
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      BASE_URL: https://${DOMAIN}
      NEXTAUTH_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: America/Sao_Paulo
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WA_CLOUD_APP_SECRET: ${WA_CLOUD_APP_SECRET}
      WA_CLOUD_VERIFY_TOKEN: ${WA_CLOUD_VERIFY_TOKEN}
      NEXT_PUBLIC_SWAGGER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  app_data:
  caddy_data:
  caddy_config:
